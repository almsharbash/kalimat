<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>كلمات - Nostr</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, sans-serif; }
    body { background: #0f1419; color: #fff; display: flex; justify-content: center; min-height: 100vh; }
    .container { width: 100%; max-width: 600px; border-left: 1px solid #2f3336; border-right: 1px solid #2f3336; padding: 15px; }
    h1 { color: #a855f7; margin-bottom: 10px; }
    .status { color: #4ade80; font-size: 14px; margin-bottom: 20px; }
    textarea { width: 100%; background: #16181c; border: 1px solid #2f3336; color: #fff; padding: 10px; border-radius: 8px; resize: none; margin-bottom: 10px; }
    button { background: #a855f7; color: #fff; border: none; padding: 10px 20px; border-radius: 20px; font-weight: bold; cursor: pointer; }
    .card { background: #16181c; padding: 12px; margin-top: 10px; border-radius: 8px; border: 1px solid #2f3336; }
    .pubkey { font-size: 12px; color: #71767b; font-family: monospace; }
  </style>
</head>
<body>
  <div class="container">
    <h1>كلمات⚡Nostr</h1>
    <div class="status" id="status">جاري الاتصال بالشبكة...</div>
    <textarea id="postText" rows="3" placeholder="ماذا يدور في ذهنك؟"></textarea>
    <button onclick="publishPost()">نشر 🚀</button>
    <div id="feed" style="margin-top: 20px;"></div>
  </div>

  <script>
    const socket = new WebSocket('wss://relay.damus.io');
    const posts = [];

    socket.onopen = () => {
      document.getElementById('status').innerText = 'متصل بشبكة Nostr الحية ⚡';
      socket.send(JSON.stringify(["REQ", "sub", { kinds: [1], limit: 15 }]));
    };

    socket.onmessage = (event) => {
      const data = JSON.parse(event.data);
      if (data[0] === "EVENT") {
        const p = data[2];
        posts.unshift(p);
        render();
      }
    };

    function render() {
      const feed = document.getElementById('feed');
      feed.innerHTML = posts.map(p => `
        <div class="card">
          <div class="pubkey">${p.pubkey.substring(0, 10)}...</div>
          <div style="margin-top:5px;">${p.content}</div>
        </div>
      `).join('');
    }

    function publishPost() {
      alert('تم استقبال منشورك محلياً! التوقيع على Nostr يتطلب مفتاح nsec.');
    }
  </script>
</body>
</html>
