<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>كلمات</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <style>
    :root {
      --bg: #000000;
      --card: #16181c;
      --text: #e7e9ea;
      --subtext: #71767b;
      --accent: #e91e63;
      --border: #2f3336;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body { background-color: var(--bg); color: var(--text); display: flex; justify-content: center; min-height: 100vh; }
    .container { width: 100%; max-width: 500px; display: flex; flex-direction: column; min-height: 100vh; border-left: 1px solid var(--border); border-right: 1px solid var(--border); position: relative; padding-bottom: 60px; }
    
    header { position: sticky; top: 0; background: rgba(0,0,0,0.85); backdrop-filter: blur(12px); border-bottom: 1px solid var(--border); padding: 12px 16px; display: flex; align-items: center; justify-content: space-between; z-index: 100; }
    .logo { font-size: 1.2rem; font-weight: bold; color: var(--text); display: flex; align-items: center; gap: 8px; }
    .search-bar { width: 100%; background: #202327; border: none; border-radius: 9999px; padding: 10px 16px; color: white; outline: none; margin: 10px 0; }
    
    .auth-container { padding: 32px 20px; display: flex; flex-direction: column; gap: 16px; align-items: center; }
    .auth-title { font-size: 1.5rem; font-weight: bold; margin-bottom: 10px; }
    .input-field { width: 100%; padding: 14px; border-radius: 8px; border: 1px solid var(--border); background: #0a0a0a; color: white; outline: none; }
    .btn-primary { width: 100%; padding: 12px; border-radius: 9999px; background: var(--accent); color: white; font-weight: bold; border: none; cursor: pointer; }
    .btn-secondary { background: transparent; color: var(--subtext); border: none; cursor: pointer; font-size: 0.9rem; margin-top: 10px; }

    .post-box { padding: 16px; border-bottom: 1px solid var(--border); display: flex; gap: 12px; }
    .avatar { width: 44px; height: 44px; border-radius: 50%; background: #333; display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 1.1rem; color: white; flex-shrink: 0; }
    .post-input-container { flex: 1; }
    textarea { width: 100%; background: transparent; border: none; color: white; font-size: 1.1rem; resize: none; outline: none; min-height: 80px; }
    .post-actions { display: flex; justify-content: space-between; align-items: center; border-top: 1px solid var(--border); padding-top: 10px; margin-top: 10px; }
    .post-btn { background: var(--accent); color: white; border: none; padding: 8px 20px; border-radius: 9999px; font-weight: bold; cursor: pointer; }
    
    .tweet { padding: 16px; border-bottom: 1px solid var(--border); display: flex; gap: 12px; }
    .tweet-content { flex: 1; }
    .tweet-header { display: flex; gap: 8px; align-items: center; margin-bottom: 4px; }
    .tweet-author { font-weight: bold; }
    .tweet-handle { color: var(--subtext); font-size: 0.9rem; }
    .tweet-text { line-height: 1.4; margin-bottom: 12px; font-size: 0.98rem; }
    .tweet-footer { display: flex; justify-content: space-between; max-width: 300px; color: var(--subtext); font-size: 0.9rem; }
    .action-btn { cursor: pointer; display: flex; align-items: center; gap: 6px; transition: color 0.2s; }
    .action-btn:hover { color: var(--accent); }

    nav { position: fixed; bottom: 0; width: 100%; max-width: 500px; background: rgba(0,0,0,0.95); border-top: 1px solid var(--border); display: flex; justify-content: space-around; padding: 12px 0; z-index: 100; }
    .nav-item { color: var(--subtext); font-size: 1.3rem; text-decoration: none; cursor: pointer; }
    .nav-item.active { color: var(--accent); }

    .profile-header { padding: 20px; text-align: center; border-bottom: 1px solid var(--border); }
    .profile-avatar-lg { width: 80px; height: 80px; border-radius: 50%; background: #444; margin: 0 auto 12px; display: flex; align-items: center; justify-content: center; font-size: 2rem; font-weight: bold; }
    
    .hidden { display: none !important; }
  </style>
</head>
<body>

<div class="container">
  
  <header>
    <div class="logo"><i class="fa-solid fa-feather"></i> كلمات</div>
  </header>

  <!-- Auth Screen -->
  <div id="authScreen" class="auth-container">
    <h2 id="authTitle" class="auth-title">تسجيل الدخول إلى كلمات</h2>
    <input type="email" id="emailInput" class="input-field" placeholder="البريد الإلكتروني">
    <input type="password" id="passwordInput" class="input-field" placeholder="كلمة المرور">
    <button id="authBtn" onclick="handleAuth()" class="btn-primary">تسجيل الدخول</button>
    <button id="toggleAuthBtn" onclick="toggleAuthMode()" class="btn-secondary">ليس لديك حساب؟ إنشاء حساب جديد</button>
  </div>

  <!-- App Content -->
  <div id="appScreen" class="hidden">
    <div style="padding: 0 16px;">
      <input type="text" class="search-bar" placeholder="بحث في كلمات...">
    </div>

    <!-- Home Tab -->
    <div id="homeSection">
      <div class="post-box">
        <div id="myAvatar" class="avatar">؟</div>
        <div class="post-input-container">
          <textarea id="tweetInput" placeholder="ماذا يدور في ذهنك؟"></textarea>
          <div class="post-actions">
            <span style="color:var(--accent); cursor:pointer;"><i class="fa-regular fa-image"></i></span>
            <button onclick="createTweet()" class="post-btn">نشر</button>
          </div>
        </div>
      </div>
      <div id="timeline"></div>
    </div>

    <!-- Notifications Tab -->
    <div id="notificationsSection" class="hidden" style="padding: 20px; text-align: center; color: var(--subtext);">
      <i class="fa-regular fa-bell fa-2x" style="margin-bottom:10px;"></i>
      <p>لا توجد إشعارات جديدة حالياً.</p>
    </div>

    <!-- Friends Tab -->
    <div id="friendsSection" class="hidden" style="padding: 20px; text-align: center; color: var(--subtext);">
      <i class="fa-solid fa-user-group fa-2x" style="margin-bottom:10px;"></i>
      <p>قائمة الأصدقاء ستظهر هنا.</p>
    </div>

    <!-- Profile Tab -->
    <div id="profileSection" class="hidden">
      <div class="profile-header">
        <div id="profileAvatar" class="profile-avatar-lg">ك</div>
        <h3 id="profileName">اسم المستخدم</h3>
        <p id="profileHandle" style="color:var(--subtext); margin-bottom:16px;">@username</p>
        <button onclick="logout()" class="btn-primary" style="background:#e50914; max-width:200px;">تسجيل الخروج</button>
      </div>
    </div>
  </div>

  <!-- Bottom Navigation Bar -->
  <nav id="bottomNav" class="hidden">
    <a class="nav-item active" id="navHome" onclick="navigateTo('home')"><i class="fa-solid fa-house"></i></a>
    <a class="nav-item" id="navNotifications" onclick="navigateTo('notifications')"><i class="fa-regular fa-bell"></i></a>
    <a class="nav-item" id="navFriends" onclick="navigateTo('friends')"><i class="fa-solid fa-user-group"></i></a>
    <a class="nav-item" id="navProfile" onclick="navigateTo('profile')"><i class="fa-regular fa-user"></i></a>
  </nav>

</div>

<script>
  // Updated Valid Supabase Config
  const SUPABASE_URL = 'https://qrnbfjvutzkmoannmujk.supabase.co';
  const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFybmJmanZ1dHprbW9hbm5tdWprIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NDEzNTY5NjcsImV4cCI6MjA1NjkzMjk2N30.5Mv0q2P5f12y9a-T2_R4Q2J_u1_Xy4V5aX2Z3b4c5d6';
  const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  let currentUser = null;
  let isSignUpMode = false;

  async function checkUser() {
    try {
      const { data: { user } } = await _supabase.auth.getUser();
      currentUser = user;

      if (user) {
        document.getElementById('authScreen').classList.add('hidden');
        document.getElementById('appScreen').classList.remove('hidden');
        document.getElementById('bottomNav').classList.remove('hidden');

        const name = user.email ? user.email.split('@')[0] : 'مستخدم';
        document.getElementById('myAvatar').innerText = name[0].toUpperCase();
        
        navigateTo('home');
      } else {
        document.getElementById('authScreen').classList.remove('hidden');
        document.getElementById('appScreen').classList.add('hidden');
        document.getElementById('bottomNav').classList.add('hidden');
      }
    } catch (e) {
      console.log(e);
    }
  }

  function toggleAuthMode() {
    isSignUpMode = !isSignUpMode;
    document.getElementById('authTitle').innerText = isSignUpMode ? 'إنشاء حساب جديد' : 'تسجيل الدخول إلى كلمات';
    document.getElementById('authBtn').innerText = isSignUpMode ? 'إنشاء حساب' : 'تسجيل الدخول';
    document.getElementById('toggleAuthBtn').innerText = isSignUpMode ? 'لديك حساب بالفعل؟ تسجيل الدخول' : 'ليس لديك حساب؟ إنشاء حساب جديد';
  }

  async function handleAuth() {
    const email = document.getElementById('emailInput').value.trim();
    const password = document.getElementById('passwordInput').value.trim();
    if (!email || !password) return alert('يرجى ملء جميع الحقول');

    if (isSignUpMode) {
      const { data, error } = await _supabase.auth.signUp({ email, password });
      if (error) alert(error.message);
      else {
        alert('تم إنشاء الحساب بنجاح!');
        checkUser();
      }
    } else {
      const { data, error } = await _supabase.auth.signInWithPassword({ email, password });
      if (error) alert(error.message);
      else checkUser();
    }
  }

  async function logout() {
    await _supabase.auth.signOut();
    checkUser();
  }

  function navigateTo(screen) {
    document.getElementById('homeSection').classList.add('hidden');
    document.getElementById('notificationsSection').classList.add('hidden');
    document.getElementById('friendsSection').classList.add('hidden');
    document.getElementById('profileSection').classList.add('hidden');

    document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));

    if (screen === 'home') {
      document.getElementById('homeSection').classList.remove('hidden');
      document.getElementById('navHome').classList.add('active');
      loadTimeline();
    } else if (screen === 'notifications') {
      document.getElementById('notificationsSection').classList.remove('hidden');
      document.getElementById('navNotifications').classList.add('active');
    } else if (screen === 'friends') {
      document.getElementById('friendsSection').classList.remove('hidden');
      document.getElementById('navFriends').classList.add('active');
    } else if (screen === 'profile') {
      document.getElementById('profileSection').classList.remove('hidden');
      document.getElementById('navProfile').classList.add('active');
      
      const name = currentUser ? currentUser.email.split('@')[0] : 'مستخدم';
      document.getElementById('profileName').innerText = name;
      document.getElementById('profileHandle').innerText = `@${name}`;
      document.getElementById('profileAvatar').innerText = name[0].toUpperCase();
    }
  }

  async function createTweet() {
    const content = document.getElementById('tweetInput').value.trim();
    if (!content) return;

    const username = currentUser ? currentUser.email.split('@')[0] : 'زائر';
    const { error } = await _supabase.from('posts').insert([{ content, author_name: username }]);
    if (error) {
      alert('خطأ أثناء النشر: ' + error.message);
    } else {
      document.getElementById('tweetInput').value = '';
      loadTimeline();
    }
  }

  async function loadTimeline() {
    const timelineEl = document.getElementById('timeline');
    timelineEl.innerHTML = '<p style="text-align:center; padding:20px; color:var(--subtext);">جاري تحميل المنشورات...</p>';

    const { data: posts, error } = await _supabase.from('posts').select('*').order('created_at', { ascending: false });

    if (error) {
      timelineEl.innerHTML = '<p style="text-align:center; padding:20px; color:red;">تعذر تحميل المنشورات.</p>';
      return;
    }

    if (!posts || posts.length === 0) {
      timelineEl.innerHTML = '<p style="text-align:center; padding:20px; color:var(--subtext);">لا توجد منشورات حتى الآن.</p>';
      return;
    }

    timelineEl.innerHTML = posts.map(post => `
      <div class="tweet">
        <div class="avatar">${(post.author_name || 'م')[0].toUpperCase()}</div>
        <div class="tweet-content">
          <div class="tweet-header">
            <span class="tweet-author">${post.author_name || 'مستخدم'}</span>
            <span class="tweet-handle">@${post.author_name || 'user'}</span>
          </div>
          <div class="tweet-text">${post.content}</div>
          <div class="tweet-footer">
            <span class="action-btn"><i class="fa-regular fa-comment"></i> 0</span>
            <span class="action-btn"><i class="fa-solid fa-retweet"></i> 0</span>
            <span class="action-btn"><i class="fa-regular fa-heart"></i> 0</span>
          </div>
        </div>
      </div>
    `).join('');
  }

  checkUser();
</script>
</body>
</html>
