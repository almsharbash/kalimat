<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kalimat App</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="icon" type="image/png" href="logo.png">
  <link rel="apple-touch-icon" href="logo.png">
  <link rel="manifest" href="manifest.json">
  <style>
    :root {
      --bg-color: #18191a;
      --card-bg: #242526;
      --hover-bg: #3a3b3c;
      --border-color: #3e4042;
      --text-main: #e4e6eb;
      --text-sub: #b0b3b8;
      --accent: #1877f2;
      --like-color: #f91880;
      --repost-color: #00ba7c;
      --danger-color: #e41e3f;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: var(--bg-color); color: var(--text-main); min-height: 100vh; overflow-x: hidden; }
    
    .app-container { width: 100%; min-height: 100vh; display: flex; flex-direction: column; padding-bottom: 60px; }

    header { position: sticky; top: 0; background-color: var(--card-bg); border-bottom: 1px solid var(--border-color); padding: 8px 16px; display: flex; justify-content: space-between; align-items: center; z-index: 100; height: 56px; }
    
    .header-right { display: flex; align-items: center; gap: 12px; }
    .back-btn { font-size: 1.2rem; color: var(--text-main); cursor: pointer; padding: 4px; display: none; }
    .back-btn:hover { color: var(--accent); }

    .brand { font-size: 1.4rem; font-weight: 800; color: var(--accent); display: flex; align-items: center; gap: 8px; cursor: pointer; }
    .brand img.app-logo { height: 32px; width: auto; object-fit: contain; }
    
    .header-icons { display: flex; gap: 8px; }
    .icon-btn { width: 40px; height: 40px; border-radius: 50%; background: var(--hover-bg); display: flex; align-items: center; justify-content: center; cursor: pointer; color: var(--text-main); font-size: 1.1rem; }
    .icon-btn:hover { background: #4e4f50; }

    .main-content { max-width: 720px; width: 100%; margin: 0 auto; padding: 12px 8px; }

    .auth-card { background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 12px; padding: 24px; max-width: 450px; margin: 40px auto; text-align: center; }
    .auth-title { font-size: 1.5rem; font-weight: 700; margin-bottom: 8px; }
    .auth-sub { color: var(--text-sub); font-size: 0.9rem; margin-bottom: 20px; }
    
    .input-box { width: 100%; padding: 12px 14px; margin-bottom: 12px; background: #18191a; border: 1px solid var(--border-color); border-radius: 8px; color: #fff; outline: none; font-size: 0.95rem; }
    .input-box:focus { border-color: var(--accent); }

    .btn-primary { background: var(--accent); color: #fff; border: none; padding: 10px 18px; border-radius: 6px; font-weight: bold; font-size: 0.95rem; cursor: pointer; width: 100%; transition: opacity 0.2s; }
    .btn-secondary { background: transparent; color: var(--text-main); border: 1px solid var(--border-color); padding: 9px 18px; border-radius: 6px; font-weight: bold; font-size: 0.9rem; cursor: pointer; width: 100%; margin-top: 10px; }
    .btn-danger { background: var(--danger-color); color: #fff; border: none; padding: 6px 12px; border-radius: 6px; font-size: 0.8rem; font-weight: bold; cursor: pointer; }
    
    .btn-follow { background: var(--accent); color: #fff; border: none; padding: 6px 14px; border-radius: 6px; font-size: 0.85rem; font-weight: bold; cursor: pointer; }
    .btn-follow.following { background: var(--hover-bg); color: var(--text-main); border: 1px solid var(--border-color); }
