<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>كلمات - Kalimat</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root {
      --bg-color: #000000;
      --card-bg: #16181c;
      --border-color: #2f3336;
      --text-main: #e7e9ea;
      --text-sub: #71767b;
      --accent: #1d9bf0;
      --accent-hover: #1a8cd8;
      --like-color: #f91880;
      --dislike-color: #e0245e;
      --green: #00ba7c;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: var(--bg-color); color: var(--text-main); display: flex; justify-content: center; min-height: 100vh; }
    .layout-container { width: 100%; max-width: 600px; min-height: 100vh; border-left: 1px solid var(--border-color); border-right: 1px solid var(--border-color); display: flex; flex-direction: column; padding-bottom: 70px; }

    header { position: sticky; top: 0; background-color: rgba(0, 0, 0, 0.75); backdrop-filter: blur(12px); border-bottom: 1px solid var(--border-color); padding: 12px 16px; display: flex; justify-content: space-between; align-items: center; z-index: 100; }
    .brand-title { font-size: 1.3rem; font-weight: 800; color: var(--text-main); display: flex; align-items: center; gap: 8px; }
    .brand-title i { color: var(--accent); }
    .user-pill { font-size: 0.85rem; color: var(--text-sub); background: var(--card-bg); padding: 6px 12px; border-radius: 20px; border: 1px solid var(--border-color); }

    .nav-bar { position: fixed; bottom: 0; width: 100%; max-width: 600px; background-color: rgba(0, 0, 0, 0.85); backdrop-filter: blur(12px); border-top: 1px solid var(--border-color); display: flex; justify-content: space-around; padding: 12px 0; z-index: 100; }
    .nav-item { color: var(--text-sub); font-size: 1.3rem; cursor: pointer; transition: color 0.2s; }
    .nav-item.active, .nav-item:hover { color: var(--accent); }

    .tweet-box { padding: 16px; border-bottom: 1px solid var(--border-color); display: flex; gap: 12px; }
    .avatar { width: 42px; height: 42px; border-radius: 50%; background: #333; display: flex; align-items: center; justify-content: center; font-weight: bold; color: var(--accent); flex-shrink: 0; }
    .tweet-input-area { flex-grow: 1; }
    textarea { width: 100%; background: transparent; border: none; color: var(--text-main); font-size: 1.1rem; resize: none; outline: none; min-height: 60px; }
    
    .img-preview { max-width: 100%; border-radius: 12px; margin-top: 10px; display: none; border: 1px solid var(--border-color); }

    .tweet-actions { display: flex; justify-content: space-between; align-items: center; margin-top: 10px; border-top: 1px solid rgba(255,255,255,0.05); padding-top: 10px; }
    .btn-tweet { background-color: var(--accent); color: white; border: none; padding: 8px 18px; border-radius: 20px; font-weight: bold; font-size: 0.95rem; cursor: pointer; }

    .post { padding: 16px; border-bottom: 1px solid var(--border-color); display: flex; gap: 12px; }
    .post-main { flex-grow: 1; }
    .post-header { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
    .post-author { font-weight: 700; color: var(--text-main); font-size: 0.95rem; }
    .post-time { color: var(--text-sub); font-size: 0.85rem; }
    .post-text { font-size: 0.95rem; line-height: 1.5; white-space: pre-wrap; word-break: break-word; }
    .post-img { width: 100%; border-radius: 12px; margin-top: 10px; border: 1px solid var(--border-color); }

    .post-footer { display: flex; justify-content: space-between; max-width: 380px; margin-top: 12px; color: var(--text-sub); font-size: 0.85rem; }
    .action-btn { display: flex; align-items: center; gap: 6px; cursor: pointer; transition: color 0.2s; }
    .action-btn:hover { color: var(--accent); }
    .action-btn.like:hover { color: var(--like-color); }
    .action-btn.dislike:hover { color: var(--dislike-color); }

    .comments-section { margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--border-color); display: none; }
    .comment-item { background: var(--card-bg); padding: 8px 12px; border-radius: 8px; margin-bottom: 8px; font-size: 0.88rem; }
    .comment-author { font-weight: bold; color: var(--accent); margin-bottom: 2px; }
    .comment-input-box { display: flex; gap: 8px; margin-top: 8px; }
    .comment-input-box input { flex-grow: 1; background: #000; border: 1px solid var(--border-color); border-radius: 16px; padding: 6px 12px; color: #fff; font-size: 0.85rem; outline: none; }

    .auth-container { padding: 40px 20px; text-align: center; }
    .auth-card { background: var(--card-bg); border: 1px solid var(--border-color); padding: 24px; border-radius: 16px; margin-top: 20px; text-align: right; }
    .input-field { width: 100%; padding: 12px; margin: 8px 0 16px; background: #000; border: 1px solid var(--border-color); border-radius: 8px; color: #fff; }
    .hidden { display: none !important; }
  </style>
</head>
<body>

  <div class="layout-container">
    <header>
      <div class="brand-title"><i class="fa-solid fa-feather-pointed"></i> كلمات</div>
      <div id="userInfo" class="user-pill hidden"></div>
    </header>

    <div id="authScreen" class="auth-container">
      <h2 style="font-size: 1.8rem; margin-bottom: 10px;">مرحباً بك في منصة كلمات</h2>
      <p style="color: var(--text-sub);">شارك أفكارك وتفاعل مع الجميع بحرية</p>

      <div class="auth-card">
        <div id="nameGroup" class="hidden">
          <label style="font-size: 0.85rem; color: var(--text-sub);">الاسم المستعار</label>
          <input type="text" id="regName" class="input-field" placeholder="أدخل اسمك">
        </div>
        <label style="font-size: 0.85rem; color: var(--text-sub);">البريد الإلكتروني</label>
        <input type="email" id="authEmail" class="input-field" placeholder="example@mail.com">
        <label style="font-size: 0.85rem; color: var(--text-sub);">كلمة السر</label>
        <input type="password" id="authPass" class="input-field" placeholder="••••••••">
        <button class="btn-tweet" style="width: 100%; padding: 12px;" onclick="submitAuth()">متابعة</button>

        <div style="text-align: center; margin-top: 16px; font-size: 0.9rem; color: var(--text-sub);">
          <span id="switchPrompt">ليس لديك حساب؟</span>
          <a style="color: var(--accent); cursor: pointer; font-weight: bold;" onclick="toggleAuthMode()" id="switchBtn">إنشاء حساب</a>
        </div>
      </div>
    </div>

    <div id="appScreen" class="hidden">
      <div class="tweet-box">
        <div class="avatar" id="myAvatar">ك</div>
        <div class="tweet-input-area">
          <textarea id="tweetContent" placeholder="ماذا يدور في أفكارك اليوم؟"></textarea>
          <input type="text" id="imgUrlInput" class="input-field hidden" placeholder="ضع رابط الصورة هنا (URL)..." oninput="previewImage(this.value)">
          <img id="imgPreview" class="img-preview" src="">
          
          <div class="tweet-actions">
            <span style="color: var(--accent); cursor: pointer;" onclick="toggleImageInput()"><i class="fa-regular fa-image fa-lg"></i> إضافة صورة</span>
            <button class="btn-tweet" onclick="publishTweet()">نشر</button>
          </div>
        </div>
      </div>

      <div id="timeline">
        <div style="text-align: center; padding: 40px; color: var(--text-sub);">جاري تحميل الأفكار...</div>
      </div>
    </div>

    <div class="nav-bar hidden" id="bottomNav">
      <div class="nav-item active"><i class="fa-solid fa-house"></i></div>
      <div class="nav-item" onclick="alert('قسم البحث قادم قريباً!')"><i class="fa-solid fa-magnifying-glass"></i></div>
      <div class="nav-item" onclick="alert('لا توجد إشعارات جديدة')"><i class="fa-regular fa-bell"></i></div>
      <div class="nav-item" onclick="logout()"><i class="fa-solid fa-arrow-right-from-bracket"></i></div>
    </div>
  </div>

  <script>
    const SUPABASE_URL = 'https://qrnbfjvutzkmoannmujk.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_Q4uNpSCbSEPo5-TaWzuFqQ_yts_mf6p';
    const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    let isSignUp = false;
    let currentUser = null;

    function toggleAuthMode() {
      isSignUp = !isSignUp;
      document.getElementById('nameGroup').classList.toggle('hidden', !isSignUp);
      document.getElementById('switchPrompt').innerText = isSignUp ? 'لديك حساب بالفعل؟' : 'ليس لديك حساب؟';
      document.getElementById('switchBtn').innerText = isSignUp ? 'تسجيل الدخول' : 'إنشاء حساب';
    }

    async function checkUser() {
      const { data: { user } } = await _supabase.auth.getUser();
      currentUser = user;

      if (user) {
        document.getElementById('authScreen').classList.add('hidden');
        document.getElementById('appScreen').classList.remove('hidden');
        document.getElementById('bottomNav').classList.remove('hidden');

        const userName = user.user_metadata?.full_name || user.email.split('@')[0];
        document.getElementById('userInfo').innerText = userName;
        document.getElementById('userInfo').classList.remove('hidden');
        document.getElementById('myAvatar').innerText = userName[0].toUpperCase();

        loadTimeline();
      } else {
        document.getElementById('authScreen').classList.remove('hidden');
        document.getElementById('appScreen').classList.add('hidden');
        document.getElementById('bottomNav').classList.add('hidden');
      }
    }

    async function submitAuth() {
      const email = document.getElementById('authEmail').value.trim();
      const password = document.getElementById('authPass').value.trim();
      const name = document.getElementById('regName').value.trim();

      if (!email || !password) return alert('يرجى اختيار بريد وكلمة سر');

      if (isSignUp) {
        const { error } = await _supabase.auth.signUp({ email, password, options: { data: { full_name: name || 'عضو كلمات' } } });
        if (error) alert(error.message); else checkUser();
      } else {
        const { error } = await _supabase.auth.signInWithPassword({ email, password });
        if (error) alert('بيانات الدخول غير صحيحة'); else checkUser();
      }
    }

    async function logout() { await _supabase.auth.signOut(); checkUser(); }

    function toggleImageInput() {
      const input = document.getElementById('imgUrlInput');
      input.classList.toggle('hidden');
    }

    function previewImage(url) {
      const img = document.getElementById('imgPreview');
      if (url.trim()) { img.src = url; img.style.display = 'block'; }
      else { img.style.display = 'none'; }
    }

    async function publishTweet() {
      const content = document.getElementById('tweetContent').value.trim();
      const imageUrl = document.getElementById('imgUrlInput').value.trim();
      if (!content && !imageUrl) return;

      const name = currentUser?.user_metadata?.full_name || currentUser?.email?.split('@')[0];

      const { error } = await _supabase.from('posts').insert([{ content, author_name: name, image_url: imageUrl }]);
      if (error) alert('حدث خطأ أثناء النشر');
      else {
        document.getElementById('tweetContent').value = '';
        document.getElementById('imgUrlInput').value = '';
        document.getElementById('imgPreview').style.display = 'none';
        document.getElementById('imgUrlInput').classList.add('hidden');
        loadTimeline();
      }
    }

    async function loadTimeline() {
      const { data: posts, error } = await _supabase.from('posts').select('*').order('created_at', { ascending: false });
      const timeline = document.getElementById('timeline');

      if (error || !posts || posts.length === 0) {
        timeline.innerHTML = `<div style="text-align: center; padding: 40px; color: var(--text-sub);">لا توجد منشورات حتى الآن. كن أول من ينشر!</div>`;
        return;
      }

      timeline.innerHTML = '';
      for (const post of posts) {
        const { data: comments } = await _supabase.from('comments').select('*').eq('post_id', post.id).order('created_at', { ascending: true });
        
        const postElement = document.createElement('div');
        postElement.className = 'post';
        postElement.innerHTML = `
          <div class="avatar">${post.author_name ? post.author_name[0].toUpperCase() : '؟'}</div>
          <div class="post-main">
            <div class="post-header">
              <span class="post-author">${post.author_name}</span>
              <span class="post-time">• ${new Date(post.created_at).toLocaleTimeString('ar-EG', {hour:'2-digit', minute:'2-digit'})}</span>
            </div>
            <div class="post-text">${post.content || ''}</div>
            ${post.image_url ? `<img src="${post.image_url}" class="post-img">` : ''}
            
            <div class="post-footer">
              <div class="action-btn" onclick="toggleComments(${post.id})">
                <i class="fa-regular fa-comment"></i> <span>${comments ? comments.length : 0}</span>
              </div>
              <div class="action-btn like" onclick="handleLike(${post.id}, 'like', ${post.likes_count || 0})">
                <i class="fa-regular fa-heart"></i> <span>${post.likes_count || 0}</span>
              </div>
              <div class="action-btn dislike" onclick="handleLike(${post.id}, 'dislike', ${post.dislikes_count || 0})">
                <i class="fa-regular fa-thumbs-down"></i> <span>${post.dislikes_count || 0}</span>
              </div>
              <div class="action-btn" onclick="sharePost('${post.content}')">
                <i class="fa-solid fa-share-nodes"></i>
              </div>
            </div>

            <div class="comments-section" id="comments-${post.id}">
              <div id="comments-list-${post.id}">
                ${(comments || []).map(c => `
                  <div class="comment-item">
                    <div class="comment-author">${c.author_name}</div>
                    <div>${c.content}</div>
                  </div>
                `).join('')}
              </div>
              <div class="comment-input-box">
                <input type="text" id="comment-input-${post.id}" placeholder="اكتب رداً...">
                <button class="btn-tweet" style="padding: 4px 12px; font-size: 0.8rem;" onclick="addComment(${post.id})">رد</button>
              </div>
            </div>
          </div>
        `;
        timeline.appendChild(postElement);
      }
    }

    async function handleLike(postId, type, currentCount) {
      const column = type === 'like' ? 'likes_count' : 'dislikes_count';
      const { error } = await _supabase.from('posts').update({ [column]: currentCount + 1 }).eq('id', postId);
      if (!error) loadTimeline();
    }

    function toggleComments(postId) {
      const sec = document.getElementById(`comments-${postId}`);
      sec.style.display = sec.style.display === 'block' ? 'none' : 'block';
    }

    async function addComment(postId) {
      const input = document.getElementById(`comment-input-${postId}`);
      const content = input.value.trim();
      if (!content) return;

      const name = currentUser?.user_metadata?.full_name || currentUser?.email?.split('@')[0];

      const { error } = await _supabase.from('comments').insert([{ post_id: postId, author_name: name, content }]);
      if (!error) {
        input.value = '';
        loadTimeline();
      }
    }

    function sharePost(text) {
      if (navigator.share) {
        navigator.share({ title: 'منصة كلمات', text: text, url: window.location.href });
      } else {
        navigator.clipboard.writeText(text);
        alert('تم نسخ نص المنشور إلى الحافظة!');
      }
    }

    checkUser();
  </script>
</body>
          </html>
