<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>كلمات - Kalimat</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root {
      --bg-color: #000000;
      --card-bg: #16181c;
      --border-color: #2f3336;
      --text-main: #f7f9f9;
      --text-sub: #71767b;
      --accent: #1d9bf0;
      --accent-hover: #1a8cd8;
      --like-color: #f91880;
      --retweet-color: #00ba7c;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: var(--bg-color); color: var(--text-main); display: flex; justify-content: center; min-height: 100vh; }
    .layout-container { width: 100%; max-width: 600px; min-height: 100vh; border-left: 1px solid var(--border-color); border-right: 1px solid var(--border-color); display: flex; flex-direction: column; padding-bottom: 70px; }

    header { position: sticky; top: 0; background-color: rgba(0, 0, 0, 0.8); backdrop-filter: blur(12px); border-bottom: 1px solid var(--border-color); padding: 12px 16px; display: flex; justify-content: space-between; align-items: center; z-index: 100; }
    .brand-title { font-size: 1.3rem; font-weight: 800; color: var(--text-main); display: flex; align-items: center; gap: 8px; }
    .brand-title i { color: var(--accent); }
    
    .user-pill { display: flex; align-items: center; gap: 8px; font-size: 0.85rem; color: var(--text-main); background: var(--card-bg); padding: 4px 12px 4px 6px; border-radius: 20px; border: 1px solid var(--border-color); cursor: pointer; }
    .avatar-mini { width: 28px; height: 28px; border-radius: 50%; background: var(--accent); display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 0.8rem; overflow: hidden; }

    .nav-bar { position: fixed; bottom: 0; width: 100%; max-width: 600px; background-color: rgba(0, 0, 0, 0.85); backdrop-filter: blur(12px); border-top: 1px solid var(--border-color); display: flex; justify-content: space-around; padding: 12px 0; z-index: 100; }
    .nav-item { color: var(--text-sub); font-size: 1.3rem; cursor: pointer; transition: color 0.2s; }
    .nav-item.active, .nav-item:hover { color: var(--accent); }

    .tweet-box { padding: 16px; border-bottom: 1px solid var(--border-color); display: flex; gap: 12px; }
    .avatar { width: 44px; height: 44px; border-radius: 50%; background: #333; display: flex; align-items: center; justify-content: center; font-weight: bold; color: #fff; flex-shrink: 0; overflow: hidden; }
    .tweet-input-area { flex-grow: 1; }
    textarea { width: 100%; background: transparent; border: none; color: var(--text-main); font-size: 1.1rem; resize: none; outline: none; min-height: 70px; }
    
    .img-preview-container { position: relative; display: inline-block; margin-top: 10px; }
    .img-preview { max-width: 100%; max-height: 280px; border-radius: 14px; display: none; border: 1px solid var(--border-color); object-fit: cover; }
    .remove-img-btn { position: absolute; top: 8px; right: 8px; background: rgba(0,0,0,0.7); color: white; border: none; border-radius: 50%; width: 26px; height: 26px; cursor: pointer; display: none; }

    .tweet-actions { display: flex; justify-content: space-between; align-items: center; margin-top: 10px; border-top: 1px solid rgba(255,255,255,0.08); padding-top: 10px; }
    .media-btn { color: var(--accent); cursor: pointer; font-size: 1.1rem; display: flex; align-items: center; gap: 6px; }
    .btn-tweet { background-color: var(--accent); color: white; border: none; padding: 8px 18px; border-radius: 20px; font-weight: bold; font-size: 0.95rem; cursor: pointer; }

    .post { padding: 16px; border-bottom: 1px solid var(--border-color); display: flex; gap: 12px; }
    .post-main { flex-grow: 1; }
    .post-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 6px; }
    .post-author-info { display: flex; align-items: center; gap: 6px; }
    .post-author { font-weight: 700; color: var(--text-main); font-size: 0.95rem; }
    .post-time { color: var(--text-sub); font-size: 0.85rem; }
    .post-text { font-size: 0.98rem; line-height: 1.5; white-space: pre-wrap; word-break: break-word; }
    .post-img { width: 100%; max-height: 380px; border-radius: 14px; margin-top: 10px; border: 1px solid var(--border-color); object-fit: cover; }

    .post-footer { display: flex; justify-content: space-between; max-width: 420px; margin-top: 12px; color: var(--text-sub); font-size: 0.85rem; }
    .action-btn { display: flex; align-items: center; gap: 6px; cursor: pointer; padding: 4px 8px; border-radius: 12px; user-select: none; }
    .action-btn.liked { color: var(--like-color); }
    .action-btn.liked i { font-weight: 900; }

    .comments-section { margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--border-color); display: none; }
    .comment-item { background: var(--card-bg); padding: 8px 12px; border-radius: 10px; margin-bottom: 8px; font-size: 0.88rem; }
    .comment-author { font-weight: bold; color: var(--accent); margin-bottom: 2px; }
    .comment-input-box { display: flex; gap: 8px; margin-top: 8px; }
    .comment-input-box input { flex-grow: 1; background: #000; border: 1px solid var(--border-color); border-radius: 18px; padding: 8px 14px; color: #fff; font-size: 0.85rem; outline: none; }

    .auth-container { padding: 40px 20px; text-align: center; }
    .auth-card { background: var(--card-bg); border: 1px solid var(--border-color); padding: 24px; border-radius: 16px; margin-top: 20px; text-align: right; }
    .input-field { width: 100%; padding: 12px; margin: 8px 0 16px; background: #000; border: 1px solid var(--border-color); border-radius: 8px; color: #fff; outline: none; font-size: 0.95rem; }

    .modal-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.7); display: flex; justify-content: center; align-items: center; z-index: 200; padding: 16px; }
    .modal-card { background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 16px; width: 100%; max-width: 440px; padding: 20px; text-align: right; }
    .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; border-bottom: 1px solid var(--border-color); padding-bottom: 10px; }

    .hidden { display: none !important; }
  </style>
</head>
<body>

  <div class="layout-container">
    <header>
      <div class="brand-title"><i class="fa-solid fa-feather-pointed"></i> كلمات</div>
      <div id="userInfo" class="user-pill hidden" onclick="openSettings()">
        <span id="userPillName">المستخدم</span>
        <div class="avatar-mini" id="userPillAvatar">ك</div>
      </div>
    </header>

    <div id="authScreen" class="auth-container">
      <h2 style="font-size: 1.8rem; margin-bottom: 10px;">مرحباً بك في منصة كلمات</h2>
      <p style="color: var(--text-sub);">شارك أفكارك وتفاعل مع الجميع بحرية</p>

      <div class="auth-card">
        <div id="nameGroup" class="hidden">
          <label style="font-size: 0.85rem; color: var(--text-sub);">الاسم المستعار</label>
          <input type="text" id="regName" class="input-field" placeholder="أدخل اسمك الكامل">
        </div>
        <label style="font-size: 0.85rem; color: var(--text-sub);">البريد الإلكتروني</label>
        <input type="email" id="authEmail" class="input-field" placeholder="example@mail.com">
        <label style="font-size: 0.85rem; color: var(--text-sub);">كلمة السر</label>
        <input type="password" id="authPass" class="input-field" placeholder="••••••••">
        <button class="btn-tweet" style="width: 100%; padding: 12px;" onclick="submitAuth()">متابعة</button>

        <div style="text-align: center; margin-top: 16px; font-size: 0.9rem; color: var(--text-sub);">
          <span id="switchPrompt">ليس لديك حساب؟</span>
          <a style="color: var(--accent); cursor: pointer; font-weight: bold;" onclick="toggleAuthMode()" id="switchBtn">إنشاء حساب</a>
        </div>
      </div>
    </div>

    <div id="appScreen" class="hidden">
      <div class="tweet-box">
        <div class="avatar" id="myAvatar">ك</div>
        <div class="tweet-input-area">
          <textarea id="tweetContent" placeholder="ماذا يدور في أفكارك اليوم؟"></textarea>

          <div class="img-preview-container">
            <img id="imgPreview" class="img-preview" src="">
            <button class="remove-img-btn" id="removeImgBtn" onclick="clearSelectedImage()"><i class="fa-solid fa-xmark"></i></button>
          </div>
          
          <div class="tweet-actions">
            <label class="media-btn">
              <i class="fa-regular fa-image"></i>
              <span style="font-size: 0.85rem;">صورة</span>
              <input type="file" id="imageFileInput" accept="image/*" class="hidden" onchange="handleImageSelect(event)">
            </label>
            <button class="btn-tweet" onclick="publishTweet()">نشر</button>
          </div>
        </div>
      </div>

      <div id="timeline">
        <div style="text-align: center; padding: 40px; color: var(--text-sub);">جاري تحميل الأفكار...</div>
      </div>
    </div>

    <div id="settingsModal" class="modal-overlay hidden">
      <div class="modal-card">
        <div class="modal-header">
          <h3 style="font-size: 1.1rem;"><i class="fa-solid fa-gear"></i> إعدادات الحساب</h3>
          <i class="fa-solid fa-xmark" style="cursor: pointer;" onclick="closeSettings()"></i>
        </div>
        
        <label style="font-size: 0.85rem; color: var(--text-sub);">تعديل الاسم المستعار</label>
        <input type="text" id="editDisplayName" class="input-field" placeholder="اسمك الظاهر">
        
        <label style="font-size: 0.85rem; color: var(--text-sub);">رابط الصورة الشخصية المباشر</label>
        <input type="text" id="editAvatarUrl" class="input-field" placeholder="https://i.ibb.co/example.jpg">
        
        <button class="btn-tweet" style="width: 100%; padding: 10px;" onclick="saveProfileSettings()">حفظ التغييرات</button>
      </div>
    </div>

    <div class="nav-bar hidden" id="bottomNav">
      <div class="nav-item active"><i class="fa-solid fa-house"></i></div>
      <div class="nav-item" onclick="alert('قسم البحث قادم قريباً!')"><i class="fa-solid fa-magnifying-glass"></i></div>
      <div class="nav-item" onclick="openSettings()"><i class="fa-solid fa-gear"></i></div>
      <div class="nav-item" onclick="logout()"><i class="fa-solid fa-arrow-right-from-bracket"></i></div>
    </div>
  </div>

  <script>
    const SUPABASE_URL = 'https://qrnbfjvutzkmoannmujk.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_Q4uNpSCbSEPo5-TaWzuFqQ_yts_mf6p';
    const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    let isSignUp = false;
    let currentUser = null;
    let currentBase64Image = '';
    let likedPosts = JSON.parse(localStorage.getItem('kalimat_likes') || '{}');

    function toggleAuthMode() {
      isSignUp = !isSignUp;
      document.getElementById('nameGroup').classList.toggle('hidden', !isSignUp);
      document.getElementById('switchPrompt').innerText = isSignUp ? 'لديك حساب بالفعل؟' : 'ليس لديك حساب؟';
      document.getElementById('switchBtn').innerText = isSignUp ? 'تسجيل الدخول' : 'إنشاء حساب';
    }

    async function checkUser() {
      const { data: { user } } = await _supabase.auth.getUser();
      currentUser = user;

      if (user) {
        document.getElementById('authScreen').classList.add('hidden');
        document.getElementById('appScreen').classList.remove('hidden');
        document.getElementById('bottomNav').classList.remove('hidden');

        updateUserDisplay();
        loadTimeline();
      } else {
        document.getElementById('authScreen').classList.remove('hidden');
        document.getElementById('appScreen').classList.add('hidden');
        document.getElementById('bottomNav').classList.add('hidden');
      }
    }

    function updateUserDisplay() {
      if (!currentUser) return;
      const meta = currentUser.user_metadata || {};
      const name = meta.full_name || currentUser.email.split('@')[0];
      const avatarUrl = meta.avatar_url;

      document.getElementById('userPillName').innerText = name;
      document.getElementById('userInfo').classList.remove('hidden');

      const avatarBox = document.getElementById('myAvatar');
      const pillAvatar = document.getElementById('userPillAvatar');

      if (avatarUrl) {
        avatarBox.innerHTML = `<img src="${avatarUrl}" style="width:100%;height:100%;object-fit:cover;">`;
        pillAvatar.innerHTML = `<img src="${avatarUrl}" style="width:100%;height:100%;object-fit:cover;">`;
      } else {
        avatarBox.innerText = name[0].toUpperCase();
        pillAvatar.innerText = name[0].toUpperCase();
      }
    }

    async function submitAuth() {
      const email = document.getElementById('authEmail').value.trim();
      const password = document.getElementById('authPass').value.trim();
      const name = document.getElementById('regName').value.trim();

      if (!email || !password) return alert('يرجى إدخال البريد وكلمة السر');

      if (isSignUp) {
        const { error } = await _supabase.auth.signUp({ email, password, options: { data: { full_name: name || 'عضو كلمات' } } });
        if (error) alert(error.message); else checkUser();
      } else {
        const { error } = await _supabase.auth.signInWithPassword({ email, password });
        if (error) alert('بيانات الدخول غير صحيحة'); else checkUser();
      }
    }

    async function logout() { await _supabase.auth.signOut(); checkUser(); }

    function handleImageSelect(event) {
      const file = event.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(e) {
        currentBase64Image = e.target.result;
        const img = document.getElementById('imgPreview');
        img.src = currentBase64Image;
        img.style.display = 'block';
        document.getElementById('removeImgBtn').style.display = 'block';
      };
      reader.readAsDataURL(file);
    }

    function clearSelectedImage() {
      currentBase64Image = '';
      document.getElementById('imgPreview').style.display = 'none';
      document.getElementById('removeImgBtn').style.display = 'none';
      document.getElementById('imageFileInput').value = '';
    }

    async function publishTweet() {
      const content = document.getElementById('tweetContent').value.trim();
      if (!content && !currentBase64Image) return;

      const meta = currentUser?.user_metadata || {};
      const name = meta.full_name || currentUser?.email?.split('@')[0];

      const { error } = await _supabase.from('posts').insert([{ 
        content, 
        author_name: name, 
        image_url: currentBase64Image 
      }]);

      if (error) alert('حدث خطأ أثناء النشر');
      else {
        document.getElementById('tweetContent').value = '';
        clearSelectedImage();
        loadTimeline();
      }
    }

    async function handleRetweet(content, author) {
      const meta = currentUser?.user_metadata || {};
      const myName = meta.full_name || currentUser?.email?.split('@')[0];
      const retweetContent = `أعاد نشر 🔄 (@${author}):\n"${content}"`;

      const { error } = await _supabase.from('posts').insert([{ 
        content: retweetContent, 
        author_name: myName 
      }]);

      if (!error) loadTimeline();
    }

    async function loadTimeline() {
      const { data: posts, error } = await _supabase.from('posts').select('*').order('created_at', { ascending: false });
      const timeline = document.getElementById('timeline');

      if (error || !posts || posts.length === 0) {
        timeline.innerHTML = `<div style="text-align: center; padding: 40px; color: var(--text-sub);">لا توجد منشورات حتى الآن. كن أول من ينشر!</div>`;
        return;
      }

      timeline.innerHTML = '';
      for (const post of posts) {
        const { data: comments } = await _supabase.from('comments').select('*').eq('post_id', post.id).order('created_at', { ascending: true });
        const isLiked = !!likedPosts[post.id];
        const likesCount = (post.likes_count || 0) + (isLiked ? 1 : 0);
        
        const postElement = document.createElement('div');
        postElement.className = 'post';
        postElement.innerHTML = `
          <div class="avatar">${post.author_name ? post.author_name[0].toUpperCase() : '؟'}</div>
          <div class="post-main">
            <div class="post-header">
              <div class="post-author-info">
                <span class="post-author">${post.author_name}</span>
                <span class="post-time">• ${new Date(post.created_at).toLocaleTimeString('ar-EG', {hour:'2-digit', minute:'2-digit'})}</span>
              </div>
            </div>
            <div class="post-text">${post.content || ''}</div>
            ${post.image_url ? `<img src="${post.image_url}" class="post-img">` : ''}
            
            <div class="post-footer">
              <div class="action-btn" onclick="toggleComments(${post.id})">
                <i class="fa-regular fa-comment"></i> <span>${comments ? comments.length : 0}</span>
              </div>
              <div class="action-btn retweet" onclick="handleRetweet('${(post.content || '').replace(/'/g, "\\'")}', '${post.author_name}')">
                <i class="fa-solid fa-retweet"></i> <span>إعادة نشر</span>
              </div>
              <div class="action-btn ${isLiked ? 'liked' : ''}" id="like-btn-${post.id}" onclick="toggleLike(${post.id})">
                <i class="${isLiked ? 'fa-solid' : 'fa-regular'} fa-heart"></i> <span id="like-count-${post.id}">${likesCount}</span>
              </div>
              <div class="action-btn" onclick="sharePost('${(post.content || '').replace(/'/g, "\\'")}')">
                <i class="fa-solid fa-share-nodes"></i>
              </div>
            </div>

            <div class="comments-section" id="comments-${post.id}">
              <div id="comments-list-${post.id}">
                ${(comments || []).map(c => `
                  <div class="comment-item">
                    <div class="comment-author">${c.author_name}</div>
                    <div>${c.content}</div>
                  </div>
                `).join('')}
              </div>
              <div class="comment-input-box">
                <input type="text" id="comment-input-${post.id}" placeholder="اكتب رداً...">
                <button class="btn-tweet" style="padding: 6px 14px; font-size: 0.8rem;" onclick="addComment(${post.id})">رد</button>
              </div>
            </div>
          </div>
        `;
        timeline.appendChild(postElement);
      }
    }

    function toggleLike(postId) {
      const btn = document.getElementById(`like-btn-${postId}`);
      const countSpan = document.getElementById(`like-count-${postId}`);
      let currentCount = parseInt(countSpan.innerText) || 0;

      if (likedPosts[postId]) {
        delete likedPosts[postId];
        btn.classList.remove('liked');
        btn.querySelector('i').className = 'fa-regular fa-heart';
        countSpan.innerText = Math.max(0, currentCount - 1);
      } else {
        likedPosts[postId] = true;
        btn.classList.add('liked');
        btn.querySelector('i').className = 'fa-solid fa-heart';
        countSpan.innerText = currentCount + 1;
      }
      localStorage.setItem('kalimat_likes', JSON.stringify(likedPosts));
      _supabase.from('posts').rpc('increment_likes', { row_id: postId }).then(() => {}).catch(() => {});
    }

    function toggleComments(postId) {
      const sec = document.getElementById(`comments-${postId}`);
      sec.style.display = sec.style.display === 'block' ? 'none' : 'block';
    }

    async function addComment(postId) {
      const input = document.getElementById(`comment-input-${postId}`);
      const content = input.value.trim();
      if (!content) return;

      const meta = currentUser?.user_metadata || {};
      const name = meta.full_name || currentUser?.email?.split('@')[0];

      const { error } = await _supabase.from('comments').insert([{ post_id: postId, author_name: name, content }]);
      if (!error) {
        input.value = '';
        loadTimeline();
      }
    }

    function openSettings() {
      const meta = currentUser?.user_metadata || {};
      document.getElementById('editDisplayName').value = meta.full_name || '';
      document.getElementById('editAvatarUrl').value = meta.avatar_url || '';
      document.getElementById('settingsModal').classList.remove('hidden');
    }

    function closeSettings() {
      document.getElementById('settingsModal').classList.add('hidden');
    }

    async function saveProfileSettings() {
      const newName = document.getElementById('editDisplayName').value.trim();
      const newAvatar = document.getElementById('editAvatarUrl').value.trim();

      const { data, error } = await _supabase.auth.updateUser({
        data: { full_name: newName, avatar_url: newAvatar }
      });

      if (error) {
        alert('حدث خطأ أثناء حفظ البيانات');
      } else {
        currentUser = data.user;
        updateUserDisplay();
        closeSettings();
        loadTimeline();
      }
    }

    function sharePost(text) {
      if (navigator.share) {
        navigator.share({ title: 'كلمات', text: text, url: window.location.href });
      } else {
        navigator.clipboard.writeText(text);
        alert('تم نسخ النص!');
      }
    }

    checkUser();
  </script>
</body>
  </html>
