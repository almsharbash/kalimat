<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>كلمات - Nostr Platform</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body { background-color: #0f1419; color: #e7e9ea; display: flex; justify-content: center; min-height: 100vh; }
    .app { width: 100%; max-width: 600px; border-left: 1px solid #2f3336; border-right: 1px solid #2f3336; display: flex; flex-direction: column; }
    header { padding: 16px; border-bottom: 1px solid #2f3336; background: rgba(15, 20, 25, 0.85); backdrop-filter: blur(12px); position: sticky; top: 0; z-index: 10; display: flex; justify-content: space-between; align-items: center; }
    header h1 { font-size: 20px; color: #a855f7; font-weight: 800; }
    .status { font-size: 12px; padding: 4px 10px; border-radius: 12px; background: #22c55e22; color: #4ade80; border: 1px solid #22c55e44; }
    .post-box { padding: 16px; border-bottom: 1px solid #2f3336; }
    textarea { width: 100%; background: transparent; border: none; color: #fff; font-size: 17px; resize: none; outline: none; margin-bottom: 12px; }
    .controls { display: flex; justify-content: space-between; align-items: center; }
    .nsec-input { background: #16181c; border: 1px solid #2f3336; color: #888; padding: 6px 10px; border-radius: 8px; font-size: 12px; width: 60%; outline: none; }
    .btn { background: #a855f7; color: #fff; border: none; padding: 8px 20px; border-radius: 20px; font-weight: bold; cursor: pointer; font-size: 15px; }
    .btn:hover { background: #9333ea; }
    .feed { flex: 1; }
    .card { padding: 16px; border-bottom: 1px solid #2f3336; transition: background 0.2s; }
    .card:hover { background: #16181c; }
    .card-header { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
    .avatar { width: 38px; height: 38px; border-radius: 50%; background: linear-gradient(135deg, #a855f7, #6366f1); display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 14px; }
    .pubkey { font-size: 13px; color: #71767b; font-family: monospace; }
    .content { font-size: 15px; line-height: 1.5; white-space: pre-wrap; word-break: break-word; }
    .time { font-size: 12px; color: #71767b; margin-top: 8px; }
  </style>
</head>
<body>
  <div class="app">
    <header>
      <h1>كلمات⚡Nostr</h1>
      <span class="status" id="status">جاري الاتصال بالشبكة...</span>
    </header>

    <div class="post-box">
      <textarea id="postText" rows="3" placeholder="ماذا يدور في ذهنك على شبكة Nostr اللامركزية؟"></textarea>
      <div class="controls">
        <input type="password" id="nsecKey" class="nsec-input" placeholder="المفتاح الخاص (nsec / hex) اختياري">
        <button class="btn" onclick="publishPost()">نشر 🚀</button>
      </div>
    </div>

    <div class="feed" id="feed">
      <div style="text-align: center; padding: 40px; color: #71767b;">جاري جلب المنشورات الحية من Relays...</div>
    </div>
  </div>

  <script src="https://unpkg.com/nostr-tools/lib/nostr.bundle.js"></script>
  <script>
    const RELAYS = [
      'wss://relay.damus.io',
      'wss://nos.lol',
      'wss://relay.nostr.band'
    ];

    let socket;
    const postsMap = new Map();

    function connectNostr() {
      const relayUrl = RELAYS[0];
      socket = new WebSocket(relayUrl);

      socket.onopen = () => {
        document.getElementById('status').innerText = 'متصل بـ Damus Relay ⚡';
        // طلب آخر 20 منشور من الشبكة العامة (Kind 1)
        const req = JSON.stringify(["REQ", "kalimat-sub", { kinds: [1], limit: 20 }]);
        socket.send(req);
      };

      socket.onmessage = (event) => {
        const data = JSON.parse(event.data);
        if (data[0] === "EVENT") {
          const nostrEvent = data[2];
          postsMap.set(nostrEvent.id, nostrEvent);
          renderFeed();
        }
      };

      socket.onerror = () => {
        document.getElementById('status').innerText = 'فشل الاتصال بالـ Relay';
      };
    }

    function renderFeed() {
      const feed = document.getElementById('feed');
      const posts = Array.from(postsMap.values()).sort((a, b) => b.created_at - a.created_at);
      
      if (posts.length === 0) return;

      feed.innerHTML = posts.map(p => {
        const shortKey = p.pubkey.substring(0, 8) + '...' + p.pubkey.substring(p.pubkey.length - 4);
        const date = new Date(p.created_at * 1000).toLocaleTimeString('ar-EG', { hour: '2-digit', minute: '2-digit' });
        return `
          <div class="card">
            <div class="card-header">
              <div class="avatar">${shortKey.substring(0,2).toUpperCase()}</div>
              <div>
                <div class="pubkey">${shortKey}</div>
              </div>
            </div>
            <div class="content">${escapeHtml(p.content)}</div>
            <div class="time">${date}</div>
          </div>
        `;
      }).join('');
    }

    function escapeHtml(text) {
      return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }

    function publishPost() {
      const text = document.getElementById('postText').value.trim();
      if (!text) return alert('الرجاء كتابة نص المنشور');

      // إنشاء الحدث برمجياً
      alert('تم استقبال منشورك! في Nostr يستحسن استخدام إضافة مثل Alby أو مفاتيحك الخاصة لتوقيع المنشور.');
      document.getElementById('postText').value = '';
    }

    connectNostr();
  </script>
</body>
</html>
