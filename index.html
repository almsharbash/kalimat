<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>كلمات - Kalimat</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <!-- مكتبة أيقونات حديثة -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root {
      --bg-color: #000000;
      --card-bg: #16181c;
      --border-color: #2f3336;
      --text-main: #e7e9ea;
      --text-sub: #71767b;
      --accent: #1d9bf0;
      --accent-hover: #1a8cd8;
      --like-color: #f91880;
      --danger: #f4212e;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    
    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      display: flex;
      justify-content: center;
      min-height: 100vh;
    }

    .layout-container {
      width: 100%;
      max-width: 600px;
      min-height: 100vh;
      border-left: 1px solid var(--border-color);
      border-right: 1px solid var(--border-color);
      display: flex;
      flex-direction: column;
      padding-bottom: 60px; /* مسافة للشريط السفلي */
    }

    /* الهيدر العلوي */
    header {
      position: sticky;
      top: 0;
      background-color: rgba(0, 0, 0, 0.75);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border-color);
      padding: 12px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 100;
    }

    .brand-title {
      font-size: 1.3rem;
      font-weight: 800;
      color: var(--text-main);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .brand-title i { color: var(--accent); }

    .user-pill {
      font-size: 0.85rem;
      color: var(--text-sub);
      background: var(--card-bg);
      padding: 6px 12px;
      border-radius: 20px;
      border: 1px solid var(--border-color);
    }

    /* شريط التنقل السفلي للهواتف */
    .nav-bar {
      position: fixed;
      bottom: 0;
      width: 100%;
      max-width: 600px;
      background-color: rgba(0, 0, 0, 0.85);
      backdrop-filter: blur(12px);
      border-top: 1px solid var(--border-color);
      display: flex;
      justify-content: space-around;
      padding: 10px 0;
      z-index: 100;
    }

    .nav-item {
      color: var(--text-sub);
      font-size: 1.3rem;
      cursor: pointer;
      transition: color 0.2s;
    }

    .nav-item.active, .nav-item:hover { color: var(--accent); }

    /* نموذج كتابة منشور جديد */
    .tweet-box {
      padding: 16px;
      border-bottom: 1px solid var(--border-color);
      display: flex;
      gap: 12px;
    }

    .avatar {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      background: #333;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      color: var(--accent);
      flex-shrink: 0;
    }

    .tweet-input-area { flex-grow: 1; }

    textarea {
      width: 100%;
      background: transparent;
      border: none;
      color: var(--text-main);
      font-size: 1.1rem;
      resize: none;
      outline: none;
      min-height: 70px;
    }

    .tweet-actions {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 10px;
      border-top: 1px solid rgba(255,255,255,0.05);
      padding-top: 10px;
    }

    .btn-tweet {
      background-color: var(--accent);
      color: white;
      border: none;
      padding: 8px 18px;
      border-radius: 20px;
      font-weight: bold;
      font-size: 0.95rem;
      cursor: pointer;
    }

    .btn-tweet:hover { background-color: var(--accent-hover); }

    /* تغريدات / المنشورات */
    .post {
      padding: 16px;
      border-bottom: 1px solid var(--border-color);
      display: flex;
      gap: 12px;
      transition: background 0.2s;
    }

    .post:hover { background-color: rgba(255, 255, 255, 0.02); }

    .post-main { flex-grow: 1; }

    .post-header {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 6px;
    }

    .post-author { font-weight: 700; color: var(--text-main); font-size: 0.95rem; }
    .post-time { color: var(--text-sub); font-size: 0.85rem; }

    .post-text {
      font-size: 0.95rem;
      line-height: 1.5;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .post-footer {
      display: flex;
      justify-content: space-between;
      max-width: 300px;
      margin-top: 12px;
      color: var(--text-sub);
      font-size: 0.85rem;
    }

    .action-btn {
      display: flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
      transition: color 0.2s;
    }

    .action-btn:hover { color: var(--accent); }
    .action-btn.like:hover { color: var(--like-color); }

    /* شاشة التسجيل */
    .auth-container {
      padding: 40px 20px;
      text-align: center;
    }

    .auth-card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      padding: 24px;
      border-radius: 16px;
      margin-top: 20px;
      text-align: right;
    }

    .input-field {
      width: 100%;
      padding: 12px;
      margin: 8px 0 16px;
      background: #000;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      color: #fff;
    }

    .hidden { display: none !important; }
  </style>
</head>
<body>

  <div class="layout-container">
    
    <!-- الهيدر العلوي -->
    <header>
      <div class="brand-title">
        <i class="fa-solid fa-feather-pointed"></i> كلمات
      </div>
      <div id="userInfo" class="user-pill hidden"></div>
    </header>

    <!-- 1. شاشة الدخول / التسجيل -->
    <div id="authScreen" class="auth-container">
      <h2 style="font-size: 1.8rem; margin-bottom: 10px;">انضم إلى منصة كلمات اليوم</h2>
      <p style="color: var(--text-sub);">تواصل، شارك أفكارك، وتابع الآخرين بحرية.</p>

      <div class="auth-card">
        <div id="nameGroup" class="hidden">
          <label style="font-size: 0.85rem; color: var(--text-sub);">الاسم الكامل</label>
          <input type="text" id="regName" class="input-field" placeholder="أدخل اسمك المفصل">
        </div>

        <label style="font-size: 0.85rem; color: var(--text-sub);">البريد الإلكتروني</label>
        <input type="email" id="authEmail" class="input-field" placeholder="example@mail.com">

        <label style="font-size: 0.85rem; color: var(--text-sub);">كلمة السر</label>
        <input type="password" id="authPass" class="input-field" placeholder="••••••••">

        <button class="btn-tweet" style="width: 100%; padding: 12px; font-size: 1rem;" onclick="submitAuth()">متابعة</button>

        <div style="text-align: center; margin-top: 16px; font-size: 0.9rem; color: var(--text-sub);">
          <span id="switchPrompt">ليس لديك حساب؟</span>
          <a style="color: var(--accent); cursor: pointer; font-weight: bold;" onclick="toggleAuthMode()" id="switchBtn">إنشاء حساب</a>
        </div>
      </div>
    </div>

    <!-- 2. الواجهة الرئيسية (التغذية والمنشورات) -->
    <div id="appScreen" class="hidden">
      <!-- مربع كتابة منشور جديد -->
      <div class="tweet-box">
        <div class="avatar" id="myAvatar">ك</div>
        <div class="tweet-input-area">
          <textarea id="tweetContent" placeholder="ماذا يحدث الآن؟"></textarea>
          <div class="tweet-actions">
            <span style="color: var(--accent);"><i class="fa-regular fa-image"></i></span>
            <button class="btn-tweet" onclick="publishTweet()">نشر</button>
          </div>
        </div>
      </div>

      <!-- قائمة المنشورات (التايم لاين) -->
      <div id="timeline">
        <div style="text-align: center; padding: 40px; color: var(--text-sub);">جاري تحميل الأفكار...</div>
      </div>
    </div>

    <!-- شريط التنقل السفلي -->
    <div class="nav-bar hidden" id="bottomNav">
      <div class="nav-item active"><i class="fa-solid fa-house"></i></div>
      <div class="nav-item"><i class="fa-solid fa-magnifying-glass"></i></div>
      <div class="nav-item"><i class="fa-regular fa-bell"></i></div>
      <div class="nav-item" onclick="logout()"><i class="fa-solid fa-arrow-right-from-bracket"></i></div>
    </div>

  </div>

  <script>
    const SUPABASE_URL = 'https://qrnbfjvutzkmoannmujk.supabase.co';
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFybmJmanZ1dHprbW9hbm5tdWprIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODk0MjY2NTYsImV4cCI6MjEwNTAwMjY1Nn0.QwxNDItMRnATNTdoMqImak-s_zkQaD9vosuvMc3wm_M';
    const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    let isSignUp = false;
    let currentUser = null;

    function toggleAuthMode() {
      isSignUp = !isSignUp;
      document.getElementById('nameGroup').classList.toggle('hidden', !isSignUp);
      document.getElementById('switchPrompt').innerText = isSignUp ? 'لديك حساب بالفعل؟' : 'ليس لديك حساب؟';
      document.getElementById('switchBtn').innerText = isSignUp ? 'تسجيل الدخول' : 'إنشاء حساب';
    }

    async function checkUser() {
      const { data: { user } } = await _supabase.auth.getUser();
      currentUser = user;

      if (user) {
        document.getElementById('authScreen').classList.add('hidden');
        document.getElementById('appScreen').classList.remove('hidden');
        document.getElementById('bottomNav').classList.remove('hidden');

        const userName = user.user_metadata?.full_name || user.email.split('@')[0];
        document.getElementById('userInfo').innerText = userName;
        document.getElementById('userInfo').classList.remove('hidden');
        document.getElementById('myAvatar').innerText = userName[0].toUpperCase();

        loadTimeline();
      } else {
        document.getElementById('authScreen').classList.remove('hidden');
        document.getElementById('appScreen').classList.add('hidden');
        document.getElementById('bottomNav').classList.add('hidden');
        document.getElementById('userInfo').classList.add('hidden');
      }
    }

    async function submitAuth() {
      const email = document.getElementById('authEmail').value.trim();
      const password = document.getElementById('authPass').value.trim();
      const name = document.getElementById('regName').value.trim();

      if (!email || !password) return alert('يرجى ملء جميع البيانات المطلوب');

      if (isSignUp) {
        const { error } = await _supabase.auth.signUp({
          email,
          password,
          options: { data: { full_name: name || 'عضو كلمات' } }
        });
        if (error) alert(error.message);
        else checkUser();
      } else {
        const { error } = await _supabase.auth.signInWithPassword({ email, password });
        if (error) alert('بيانات الدخول غير صحيحة');
        else checkUser();
      }
    }

    async function logout() {
      await _supabase.auth.signOut();
      checkUser();
    }

    async function publishTweet() {
      const content = document.getElementById('tweetContent').value.trim();
      if (!content) return;

      const name = currentUser?.user_metadata?.full_name || currentUser?.email?.split('@')[0];

      const { error } = await _supabase.from('posts').insert([{ content, author_name: name }]);
      if (error) alert('تعذر النشر، حاول مجدداً');
      else {
        document.getElementById('tweetContent').value = '';
        loadTimeline();
      }
    }

    async function loadTimeline() {
      const { data, error } = await _supabase.from('posts').select('*').order('created_at', { ascending: false });
      const timeline = document.getElementById('timeline');

      if (error || !data || data.length === 0) {
        timeline.innerHTML = `<div style="text-align: center; padding: 40px; color: var(--text-sub);">لا توجد منشورات حتى الآن. كن أول من ينشر!</div>`;
        return;
      }

      timeline.innerHTML = data.map(post => `
        <div class="post">
          <div class="avatar">${post.author_name ? post.author_name[0].toUpperCase() : '؟'}</div>
          <div class="post-main">
            <div class="post-header">
              <span class="post-author">${post.author_name}</span>
              <span class="post-time">• ${new Date(post.created_at).toLocaleTimeString('ar-EG', {hour:'2-digit', minute:'2-digit'})}</span>
            </div>
            <div class="post-text">${post.content}</div>
            <div class="post-footer">
              <div class="action-btn"><i class="fa-regular fa-comment"></i></div>
              <div class="action-btn"><i class="fa-solid fa-retweet"></i></div>
              <div class="action-btn like"><i class="fa-regular fa-heart"></i></div>
              <div class="action-btn"><i class="fa-solid fa-share-nodes"></i></div>
            </div>
          </div>
        </div>
      `).join('');
    }

    checkUser();
  </script>
</body>
  </html>
