<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>كلمات - Kalimat</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root {
      --bg-color: #000000;
      --card-bg: #16181c;
      --border-color: #2f3336;
      --text-main: #f7f9f9;
      --text-sub: #71767b;
      --accent: #1d9bf0;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body { background-color: var(--bg-color); color: var(--text-main); display: flex; justify-content: center; min-height: 100vh; }
    .app-container { width: 100%; max-width: 600px; border-left: 1px solid var(--border-color); border-right: 1px solid var(--border-color); padding: 16px; }
    header { font-size: 1.4rem; font-weight: bold; color: var(--accent); border-bottom: 1px solid var(--border-color); padding-bottom: 12px; margin-bottom: 16px; display: flex; align-items: center; gap: 8px; }
    .card { background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 12px; padding: 16px; margin-bottom: 16px; }
    .input-box { width: 100%; padding: 10px; margin: 8px 0; background: #000; border: 1px solid var(--border-color); border-radius: 8px; color: #fff; outline: none; }
    .btn { background: var(--accent); color: #fff; border: none; padding: 10px 16px; border-radius: 20px; font-weight: bold; cursor: pointer; width: 100%; margin-top: 8px; }
    .post { border-bottom: 1px solid var(--border-color); padding: 12px 0; }
    .post-author { font-weight: bold; color: var(--accent); font-size: 0.9rem; }
    .post-text { margin-top: 6px; font-size: 1rem; line-height: 1.4; }
    .hidden { display: none !important; }
  </style>
</head>
<body>

  <div class="app-container">
    <header><i class="fa-solid fa-feather-pointed"></i> كلمات</header>

    <!-- واجهة تسجيل الدخول -->
    <div id="authSection" class="card">
      <h3 style="margin-bottom: 12px;">تسجيل الدخول / حساب جديد</h3>
      <input type="text" id="username" class="input-field input-box" placeholder="الاسم المستعار">
      <input type="email" id="email" class="input-field input-box" placeholder="البريد الإلكتروني">
      <input type="password" id="password" class="input-field input-box" placeholder="كلمة المرور">
      <button class="btn" onclick="handleAuth('login')">تسجيل الدخول</button>
      <button class="btn" style="background: transparent; border: 1px solid var(--border-color);" onclick="handleAuth('signup')">إنشاء حساب جديد</button>
    </div>

    <!-- واجهة المنصة بعد الدخول -->
    <div id="mainSection" class="hidden">
      <div class="card">
        <textarea id="postInput" class="input-box" rows="3" placeholder="ماذا يدور في أفكارك؟"></textarea>
        <button class="btn" onclick="addPost()">نشر</button>
      </div>
      <div id="postsList"></div>
      <button class="btn" style="background: #333; margin-top: 20px;" onclick="logout()">تسجيل الخروج</button>
    </div>
  </div>

  <script>
    const SUPABASE_URL = 'https://qrnbfjvutzkmoannmujk.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_Q4uNpSCbSEPo5-Ta09fE-g_T-9M_B9o';
    const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    async function checkSession() {
      const { data: { session } } = await _supabase.auth.getSession();
      if (session) {
        document.getElementById('authSection').classList.add('hidden');
        document.getElementById('mainSection').classList.remove('hidden');
        loadPosts();
      } else {
        document.getElementById('authSection').classList.remove('hidden');
        document.getElementById('mainSection').classList.add('hidden');
      }
    }

    async function handleAuth(type) {
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value.trim();
      const username = document.getElementById('username').value.trim();

      if (!email || !password) return alert('يرجى إدخال البريد وكلمة المرور');

      let res = type === 'signup' 
        ? await _supabase.auth.signUp({ email, password, options: { data: { full_name: username } } })
        : await _supabase.auth.signInWithPassword({ email, password });

      if (res.error) alert(res.error.message);
      else checkSession();
    }

    async function logout() {
      await _supabase.auth.signOut();
      checkSession();
    }

    async function addPost() {
      const text = document.getElementById('postInput').value.trim();
      if (!text) return;

      const { data: { user } } = await _supabase.auth.getUser();
      const author = user?.user_metadata?.full_name || user?.email?.split('@')[0] || 'مستخدم';

      const { error } = await _supabase.from('posts').insert([{ content: text, author_name: author }]);
      if (error) alert('خطأ في النشر: ' + error.message);
      else {
        document.getElementById('postInput').value = '';
        loadPosts();
      }
    }

    async function loadPosts() {
      const container = document.getElementById('postsList');
      container.innerHTML = 'جاري التحميل...';
      const { data: posts, error } = await _supabase.from('posts').select('*').order('created_at', { ascending: false });

      if (error) {
        container.innerHTML = '<p style="color:red;">خطأ في جلب البيانات</p>';
        return;
      }

      container.innerHTML = posts.map(p => `
        <div class="post">
          <div class="post-author">${p.author_name || 'مستخدم'}</div>
          <div class="post-text">${p.content}</div>
        </div>
      `).join('');
    }

    checkSession();
  </script>
</body>
</html>
